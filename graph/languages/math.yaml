# Mathematics Language Definition
# A formal language subtype of CO
#
# Math demonstrates formal exegesis:
# rigorous symbolic systems with precise,
# unambiguous meaning and transformation rules.

type: language
id: lang-math
symbol: math

inherits: [co]
exegesis_type: formal

metadata:
  name: Mathematics
  native_name: "∀∃∈⊆∩∪→↔"
  notation_systems:
    - Set theory notation
    - First-order logic
    - Category theory
    - Type theory

translations:
  english:
    term: "Mathematics"
    definition: |
      A formal language of abstract structures, relationships,
      and transformations. Provides the most precise form of
      exegesis: every symbol has exact meaning, every transformation
      follows explicit rules. The language of proof and certainty.
    example: "∀x∈ℕ: x+0=x (identity)"

  portuguese:
    term: "Matemática"
    definition: |
      Uma linguagem formal de estruturas abstratas, relações
      e transformações. Fornece a forma mais precisa de exegese:
      cada símbolo tem significado exato, cada transformação
      segue regras explícitas.
    example: "∀x∈ℕ: x+0=x (identidade)"

  math:
    term: "ℳ"
    definition: |
      Let ℳ be the set of all well-formed formulas.
      ∀φ∈ℳ: meaning(φ) is computable.
      Mathematics is the closure of logic under proof.
    example: "⊢ (P → Q) → (¬Q → ¬P)"

primitives:
  - quantifier (∀, ∃)
  - relation (=, <, ∈, ⊆)
  - operation (+, ×, ∘)
  - function (f: A → B)
  - proof (⊢)

# Mathematical structures as exegetic tools
concepts:
  - isomorphism: "A ≅ B" (structural equivalence, like translation)
  - homomorphism: structure-preserving map (like interpretation)
  - category: objects + morphisms (like type system)
  - functor: mapping between categories (like language translation)
