# Garage S3-compatible object storage — CO backups backend.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
#
# For local dev/testing use the docker-compose in this directory.
# For production, set replication_factor = 3 (requires 3 nodes).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

db_engine = "lmdb"

replication_factor = 1  # Single-node. Set 3 for HA.

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.localhost"

[s3_web]
bind_addr = "0.0.0.0:3902"
root_domain = ".web.localhost"
index = "index.html"

[admin]
api_bind_addr = "0.0.0.0:3901"
