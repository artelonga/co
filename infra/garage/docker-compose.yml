services:
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # Admin API
      - "3902:3902"   # RPC
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml

volumes:
  garage-data:
  garage-meta:
