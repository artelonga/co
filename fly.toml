# Fly.io deployment configuration
app = "co-artelonga"
primary_region = "gru"

[build]
  dockerfile = "co-web/Dockerfile"

[mounts]
  source = "co_data"
  destination = "/data"

[env]
  CO_WEB_DATA = "/data"
  CO_WEB_PORT = "3000"
  RUST_LOG = "co_web=info,tower_http=info"
  LITEFS_DIR = "/data"
  LITEFS_URL = "http://localhost:20202"
  # Both OFF. In-process reclaim is infeasible on this shared-cpu machine even with a
  # 60m health grace + maintenance mode: 40+ min, no completion, disk degraded to 85%
  # (WAL/VACUUM-temp growth) and the machine became unreachable. Reclaim must be done
  # off the live machine (temp Fly machine with sqlite3, or off-box) — see task #17.
  CO_MAINTENANCE_MODE = "0"
  CO_MAINTENANCE_RECLAIM_EVENT_LOG = "0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "90s"
