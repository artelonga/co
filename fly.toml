# Fly.io deployment configuration
app = "co-artelonga"
primary_region = "gru"

[build]
  dockerfile = "co-web/Dockerfile"

[mounts]
  source = "co_data"
  destination = "/data"

[env]
  CO_WEB_DATA = "/data"
  CO_WEB_PORT = "3000"
  RUST_LOG = "co_web=info,tower_http=info"
  LITEFS_DIR = "/data"
  LITEFS_URL = "http://localhost:20202"
  # TEMPORARY maintenance window for the one-time event_log reclaim. CO_MAINTENANCE_MODE
  # 503s all traffic except /api/health (no storage lock), so the reclaim's VACUUM runs
  # with zero request contention. REVERT BOTH to "0" once the reclaim logs success.
  CO_MAINTENANCE_MODE = "1"
  CO_MAINTENANCE_RECLAIM_EVENT_LOG = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "90s"
