# Fly.io deployment configuration
app = "co-artelonga"
primary_region = "gru"

[build]
  dockerfile = "co-web/Dockerfile"

[mounts]
  source = "co_data"
  destination = "/data"

[env]
  CO_WEB_DATA = "/data"
  CO_WEB_PORT = "3000"
  RUST_LOG = "co_web=info,tower_http=info"
  LITEFS_DIR = "/data"
  LITEFS_URL = "http://localhost:20202"
  # TEMPORARY maintenance window: 503 all traffic + run the one-time reclaim. Paired
  # with grace_period=60m on the health check below so Fly won't restart the machine
  # while the I/O-heavy delete+VACUUM runs to completion. REVERT BOTH to "0" (and
  # grace_period to "90s") once the reclaim logs success and meta.db shrinks.
  CO_MAINTENANCE_MODE = "1"
  CO_MAINTENANCE_RECLAIM_EVENT_LOG = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    # TEMPORARY: 60m grace so Fly does NOT restart the machine while the one-time
    # event_log reclaim saturates disk I/O and briefly makes /api/health unresponsive
    # (the restart-at-90s loop aborted every prior attempt). RESTORE to "90s" after.
    grace_period = "60m"
