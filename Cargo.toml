[workspace]
resolver = "2"
members = [
    "core",
    "co-cli",
]

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/institutional-pointset/co"
description = "Exegetic graph database for project development"
publish = false

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "14"

# Async
tokio = { version = "1", features = ["full"] }

# Files
memmap2 = "0.9"
walkdir = "2.5"

# Compression
zstd = "0.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Graph
petgraph = "0.6"

# Testing
tempfile = "3"

# Table formatting (pinned for Rust 1.83 compatibility)
comfy-table = "=7.1.1"
