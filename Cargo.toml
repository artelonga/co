[workspace]
resolver = "2"
members = [
    "core",
    "co-cli",
    "co-web",
    "co",
    "game-core",
    "co-agent",
    # Developer tooling — kept out of `default-members` so user `cargo install` of
    # co-cli does NOT pull these. Build explicitly: `cargo build -p co-auto`.
    "dev/co-auto",
    "dev/co-pwhash",
    "dev/co-token",
]
default-members = [
    "core",
    "co-cli",
    "co-web",
    "co",
    "game-core",
]

[workspace.package]

version = "1.80.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/artelonga/co"
description = "Graph-based content management platform — CLI, web server, kanban board"
keywords = ["content-management", "kanban", "markdown", "graph", "cli"]
categories = ["command-line-utilities", "web-programming"]
publish = false

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_mangen = "0.2"
rustyline = "14"

# Async
tokio = { version = "1", features = ["full"] }

# Files
memmap2 = "0.9"
walkdir = "2.5"

# Compression
zstd = "0.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Graph
petgraph = "0.6"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Auth & Crypto
argon2 = "0.5"
blake3 = "1"
rand = "0.8"
nanoid = "0.4"

# Cache / collections
lru = "0.12"

# Testing
tempfile = "3"

# Table formatting (pinned for Rust 1.83 compatibility)
comfy-table = "=7.1.1"
