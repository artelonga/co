name: CO Platform
description: >
  CO open-source platform — board de desenvolvimento com todas as user-stories,
  epics, tarefas, processos e eventos do projeto CO (CO-1 a CO-161+).
schema_version: 1
content_types:
  - name: user-story
    schema:
      id:
        type: number
        required: true
      title:
        type: string
        required: true
      status:
        type: enum
        values: [todo, in_progress, done, blocked, cancelled]
      priority:
        type: enum
        values: [low, medium, high, critical]
      type:
        type: string
      parent:
        type: number
      module:
        type: string
  - name: epic
    schema:
      id:
        type: number
      title:
        type: string
        required: true
      status:
        type: enum
        values: [todo, in_progress, done]
  - name: task
    schema:
      title:
        type: string
        required: true
      status:
        type: enum
        values: [todo, doing, done]
  - name: event
    schema:
      title:
        type: string
        required: true
      event_at:
        type: date
        semantic: event_at
      # CO-89: richer event kinds (releases, deploys, planning, retros).
      kind:
        type: enum
        values: [release, deploy, planning, retro, demo, outage]
      starts_at:
        type: date
        semantic: event_at
      ends_at:
        type: date
        semantic: event_at
      timezone:
        type: string
      summary:
        type: string
  # CO-89: git-backed universes — one entry per commit, written by git-sync.
  - name: commit
    schema:
      sha:
        type: string
        required: true
      title:
        type: string
        required: true
      author_handle:
        type: ref
        target: profile
      committer_handle:
        type: ref
        target: profile
      committed_at:
        type: date
        semantic: event_at
      committed_at_ns:
        type: number
      timezone:
        type: string
      parent_task:
        type: ref
        target: task
      branch:
        type: string
      # tags (conventional-commit scopes) + parents are stored as JSON arrays in
      # frontmatter; the manifest schema only declares scalar/ref fields today.
      files_changed:
        type: number
      insertions:
        type: number
      deletions:
        type: number
    indexes: [sha, author_handle, committed_at, parent_task]
  # CO-89: one entry per contributor, maintained from commit author identities.
  - name: profile
    schema:
      handle:
        type: string
        required: true
      title:
        type: string
      display_name:
        type: string
      email:
        type: string
      timezone:
        type: string
      role:
        type: enum
        values: [owner, admin, contributor, observer]
      # `analytics` is a JSON struct in frontmatter (commits_total, frequent_scopes,
      # …), recomputed by recompute_profile_analytics; not a scalar manifest field.
    indexes: [handle, role]
  - name: page
    schema:
      title:
        type: string
        required: true
  - name: reference
    schema:
      title:
        type: string
        required: true
      medium:
        type: enum
        values: [pdf, video, web, citation]
  - name: process
    schema:
      title:
        type: string
        required: true
  - name: doc
# CO-89: views over the content types. `history`/`contributors`/`events` are the
# three new views beyond the existing kanban board; `roadmap` is the Mermaid
# gantt (validates CO-83).
views:
  - name: board
    type: kanban
    source: task
  - name: history
    type: timeline
    source: commit
    date_field: committed_at
  - name: roadmap
    type: gantt
    source: task
    date_start: created_at
    date_end: due_at
  - name: contributors
    type: cards
    source: profile
  - name: events
    type: calendar
    source: event
    date_field: starts_at
