openapi: "3.1.0"

info:
  title: CO Universe Content API
  description: |
    Formal v1 specification for the CO Universe Content API.

    Any frontend (CO SPA, Svelte viewer, Obsidian plugin, mobile app, third-party tool)
    can consume universe content uniformly using this contract.

    ## Versioning

    - `v1` is locked: no breaking changes.
    - Additive changes (new optional fields, new endpoints) do not require a version bump.
    - `v2` will use a new path prefix (`/api/v2/...`) parallel to v1.
    - v1 remains supported for at least 12 months after v2 launches.

    ## Authentication

    Three access levels:

    - **Public** — no authentication required (for public universes)
    - **BearerAuth** — `Authorization: Bearer <jwt>` (obtained via POST /api/v1/auth/verify or a
      long-lived API token via POST /api/v1/auth/token)
    - **SessionAuth** — `session` cookie set by the verify endpoint

    ### Obtaining a session
    ```bash
    # 1. Request a magic code to your email
    curl -X POST /api/v1/auth/login -d '{"email":"you@example.com"}'

    # 2. Exchange the code for a JWT
    curl -X POST /api/v1/auth/verify -d '{"email":"you@example.com","code":"123456"}'
    # → { user_id, email, display_name, expires_at }
    # → Set-Cookie: session=<jwt>; HttpOnly; SameSite=Strict
    ```

    ### Using a long-lived API token
    ```bash
    TOKEN=$(curl -s -X POST /api/v1/auth/token -H "Authorization: Bearer $JWT" | jq -r .token)
    curl -H "Authorization: Bearer $TOKEN" /api/v1/universes/{slug}/vault/
    ```
  version: "1.0.0"
  contact:
    name: Arte Longa
    email: yuri@artelonga.com.br
  license:
    name: MIT

servers:
  - url: http://localhost:8742
    description: Local development
  - url: https://co-artelonga.fly.dev
    description: Production

tags:
  - name: Meta
    description: API metadata — spec and interactive documentation
  - name: Universes
    description: Universe discovery and management
  - name: Entries
    description: |
      Universe content entries — every file in a universe is an Entry
      (markdown body + YAML frontmatter parsed to JSON).
  - name: Vault
    description: |
      Obsidian Local REST API compatible vault interface.
      Authenticated; supports JWT or long-lived API token.
  - name: Auth
    description: Authentication and session management
  - name: Events
    description: |
      Universal EDA event stream (CO-380).
      Real-time events over WebSocket — filtered by scope and visibility.
      Anonymous clients receive Public events only; authenticated clients
      receive Universe-scoped events up to their membership level.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained via POST /api/v1/auth/verify, or a long-lived API token
        generated by POST /api/v1/auth/token.
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie set by POST /api/v1/auth/verify.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{2,40}$"
      description: Universe key (e.g. `template`, `my-universe`)
      example: template

  responses:
    BadRequest:
      description: Bad request — invalid input or failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: bad_request
            message: "Universe key must contain only lowercase letters, digits, and hyphens"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
            message: "Missing or malformed Authorization header"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
            message: "You do not have write access to this universe"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
            message: "Universe not found"
    Conflict:
      description: Conflict (e.g. universe slug already taken)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: conflict
            message: "A universe with this key already exists"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: too_many_requests
            message: "Too many code requests. Please wait before requesting another."
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal
            message: "An unexpected error occurred"

  schemas:

    # --------------------------------------------------------------------------
    # CO-367: KB sync
    # --------------------------------------------------------------------------

    KbIngestBody:
      type: object
      required: [universe_key, entry_path, body_hash, updated_at]
      properties:
        universe_key:
          type: string
          description: Universe that owns this entry
        entry_path:
          type: string
          description: Relative path within the universe (e.g. notes/2026-06-05.md)
        entry_type:
          type: string
          description: Content type (note, article, task, …)
        body_hash:
          type: string
          description: "SHA-256 of the entry body — format: sha256:<hex>"
        frontmatter_json:
          type: object
          description: Parsed frontmatter as a JSON object
          additionalProperties: true
        body_preview:
          type: string
          description: First 500 characters of the body (used for FTS search)
          maxLength: 500
        size_bytes:
          type: integer
          description: Full body size in bytes
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the last content modification
        asset_refs:
          type: array
          items:
            type: string
          description: "CAS sha256 references to binary assets embedded in this entry"

    KbIngestResponse:
      type: object
      required: [ok, universe_key, entry_path, indexed_at]
      properties:
        ok:
          type: boolean
        universe_key:
          type: string
        entry_path:
          type: string
        indexed_at:
          type: string
          format: date-time

    KbEntry:
      type: object
      required: [universe_key, entry_path, updated_at, indexed_at]
      properties:
        universe_key:
          type: string
        entry_path:
          type: string
        entry_type:
          type: string
        body_preview:
          type: string
        frontmatter_json:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
        indexed_at:
          type: string
          format: date-time

    KbSearchResponse:
      type: object
      required: [results, total]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KbEntry'
        total:
          type: integer

    KbRecentResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/KbEntry'

    # --------------------------------------------------------------------------
    # Error
    # --------------------------------------------------------------------------

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
          example: "Universe not found"

    # --------------------------------------------------------------------------
    # Universe
    # --------------------------------------------------------------------------

    Universe:
      type: object
      required:
        - key
        - name
        - description
        - content_count
        - is_anonymous
        - is_template
        - requires_login
        - visibility
        - content_version
      properties:
        key:
          type: string
          example: template
          description: Unique universe identifier (2–40 lowercase alphanumeric + hyphens)
        name:
          type: string
          example: CO
        description:
          type: string
          example: "Template universe"
        content_count:
          type: integer
          example: 7
        is_anonymous:
          type: boolean
          description: True for auto-created anonymous user universes
        is_template:
          type: boolean
          description: True if this universe is the canonical template
        requires_login:
          type: boolean
          description: True if access requires authentication
        visibility:
          type: string
          enum: [public, private, unlisted]
          description: |
            - `public`: visible to all (no login required for reads)
            - `private`: visible only to owner and collaborators
            - `unlisted`: accessible via link but not listed in catalog
        parent_key:
          type: string
          nullable: true
          description: Optional parent universe key for hierarchical sidebar grouping
        content_version:
          type: string
          example: "0.0.0"
          description: Semver content version; bumped by deterministic publish processes

    CreateUniverseRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[a-z0-9-]{2,40}$"
          example: my-universe
        name:
          type: string
          example: My Universe
        description:
          type: string
          default: ""
        visibility:
          type: string
          enum: [public, private, unlisted]
          default: private

    UpdateUniverseRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]

    # --------------------------------------------------------------------------
    # Entry
    # --------------------------------------------------------------------------

    Entry:
      type: object
      required:
        - path
        - universe_key
        - entry_type
        - frontmatter
        - body
        - body_hash
      properties:
        path:
          type: string
          example: projects/CO/1.md
          description: Entry path relative to universe root
        universe_key:
          type: string
          example: template
        entry_type:
          type: string
          example: task
          description: Content type as declared in _universe.yaml (e.g. task, note, post)
        title:
          type: string
          nullable: true
          example: "Drag this task to 'In Progress'"
        frontmatter:
          type: object
          additionalProperties: true
          description: |
            YAML frontmatter parsed to JSON. Schema is per-universe
            and defined in the universe's `_universe.yaml` manifest.
        body:
          type: string
          description: Markdown body below the frontmatter
        body_hash:
          type: string
          description: BLAKE3 hash of the body content
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        _score:
          type: number
          format: float
          description: |
            Cosine similarity score ∈ [0, 1]. Only present in semantic
            search results (`?semantic=...`).

    EntryList:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        total:
          type: integer
          example: 7

    CreateEntryRequest:
      type: object
      required: [path, frontmatter]
      properties:
        path:
          type: string
          example: tasks/my-task.md
        frontmatter:
          type: object
          additionalProperties: true
        body:
          type: string
          default: ""

    UpdateEntryRequest:
      type: object
      properties:
        frontmatter:
          type: object
          additionalProperties: true
          description: Partial patch merged onto existing frontmatter
        body:
          type: string

    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag:
          type: string
          example: tutorial
        count:
          type: integer
          example: 7

    TreeNode:
      type: object
      required: [entry, children]
      properties:
        entry:
          $ref: "#/components/schemas/Entry"
        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
          description: Child entries (built from the `parent` frontmatter field)

    # --------------------------------------------------------------------------
    # Vault
    # --------------------------------------------------------------------------

    VaultStat:
      type: object
      required: [ctime, mtime, size]
      properties:
        ctime:
          type: integer
          description: Creation time in milliseconds since Unix epoch
          example: 1717420800000
        mtime:
          type: integer
          description: Last modification time in milliseconds since Unix epoch
          example: 1717420800000
        size:
          type: integer
          description: File size in bytes
          example: 1024

    VaultFileInfo:
      type: object
      required: [path, stat, body_hash]
      properties:
        path:
          type: string
          example: notes/ideas.md
        stat:
          $ref: "#/components/schemas/VaultStat"
        body_hash:
          type: string
          description: >-
            CO-438: SHA-256 of the entry body (frontmatter excluded). Lets
            bulk-sync clients (`co source add`) skip re-PUTting unchanged
            entries so a re-sync touches only what changed.
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

    VaultFile:
      type: object
      required: [path, content, frontmatter, tags, stat]
      properties:
        path:
          type: string
          example: notes/ideas.md
        content:
          type: string
          description: Full markdown content including frontmatter
        frontmatter:
          type: object
          additionalProperties: true
          description: Parsed YAML frontmatter as JSON
        tags:
          type: array
          items:
            type: string
          example: [research, ideas]
        stat:
          $ref: "#/components/schemas/VaultStat"

    # --------------------------------------------------------------------------
    # Auth
    # --------------------------------------------------------------------------

    LoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    LoginResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "If registered, a code has been sent to your email"
        dev_code:
          type: string
          nullable: true
          description: |
            Six-digit code printed inline in non-production environments
            so developers can complete login without email delivery.
            Never populated in production.

    VerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    Session:
      type: object
      required: [user_id, email, display_name, expires_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: usr_a1b2c3d4
        email:
          type: string
          format: email
          example: user@example.com
        display_name:
          type: string
          example: user
        expires_at:
          type: string
          format: date-time

    User:
      type: object
      required: [id, email, display_name, tier, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: usr_a1b2c3d4
        email:
          type: string
          format: email
          example: user@example.com
        display_name:
          type: string
          example: user
        tier:
          type: string
          description: Billing / capability tier
          example: player
        created_at:
          type: string
          format: date-time
        usuario:
          type: string
          nullable: true
          description: Quilombo username (optional, quilombo-specific field)

    CreateApiTokenRequest:
      type: object
      properties:
        name:
          type: string
          default: "API token"
          example: "obsidian-plugin"

    ApiToken:
      type: object
      required: [id, name, token, expires_at]
      properties:
        id:
          type: string
          example: tok_a1b2c3
        name:
          type: string
          example: obsidian-plugin
        token:
          type: string
          description: Full token value — only shown once at creation time
          example: co_at_xxxxxxxxxxxxxxxxxxxx
        expires_at:
          type: string
          format: date-time

    SyncConflict:
      type: object
      required: [id, universe_key, path, local_body_hash, remote_body_hash, kind, detected_at, suggested_action]
      properties:
        id:
          type: string
          description: ULID
        universe_key:
          type: string
        path:
          type: string
          description: Entry path within the universe.
        local_body_hash:
          type: string
          description: SHA-256 of the local body at detection time.
        remote_body_hash:
          type: string
          description: SHA-256 of the remote body at detection time.
        kind:
          type: string
          enum:
            - both_modified
            - local_only_new
            - remote_only_new
            - local_deleted_remote_modified
            - local_modified_remote_deleted
        detected_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_action:
          type: string
          nullable: true
        suggested_action:
          type: string
          description: >
            Suggested default action for this universe. `replace` for yggdrasil
            (remote-authoritative); `update` for user-owned universes.

# =============================================================================
# Paths
# =============================================================================

paths:

  # ============================================================
  # Meta
  # ============================================================

  /api/openapi.json:
    get:
      tags: [Meta]
      summary: Machine-readable OpenAPI 3.1 spec
      operationId: getOpenApiSpec
      description: |
        Returns the full OpenAPI 3.1 specification for the Universe Content API
        as JSON. Use this to generate client stubs with openapi-generator or
        any other toolchain.
      responses:
        "200":
          description: OpenAPI 3.1 spec as JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/docs:
    get:
      tags: [Meta]
      summary: Human-readable API documentation (Swagger UI)
      operationId: getApiDocs
      description: |
        Renders the Swagger UI for the Universe Content API spec.
        Useful for interactive exploration and manual testing.
      responses:
        "200":
          description: HTML page with Swagger UI
          content:
            text/html:
              schema:
                type: string

  # ============================================================
  # Universes — public reads
  # ============================================================

  /api/v1/universes:
    get:
      tags: [Universes]
      summary: List all accessible universes
      operationId: listUniverses
      description: |
        Returns all universes visible to the caller. Anonymous callers
        see only public universes. Authenticated callers also see their
        own private universes and universes they are members of.
      responses:
        "200":
          description: List of universes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Universe"
    post:
      tags: [Universes]
      summary: Create a universe
      operationId: createUniverse
      security:
        - BearerAuth: []
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUniverseRequest"
      responses:
        "201":
          description: Universe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/universes/public:
    get:
      tags: [Universes]
      summary: Public universe catalog
      operationId: listPublicUniverses
      description: "Returns all universes with `visibility: public`."
      responses:
        "200":
          description: Public universes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Universe"

  /api/v1/universes/{slug}:
    get:
      tags: [Universes]
      summary: Get universe info
      operationId: getUniverse
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Universe metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Universes]
      summary: Update universe metadata
      operationId: updateUniverse
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUniverseRequest"
      responses:
        "200":
          description: Updated universe
          content:
            application/json:
              schema:
                type: object
                required: [key, name, description, visibility]
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  visibility:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Universes]
      summary: Delete a universe
      operationId: deleteUniverse
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Universe deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: string
                    description: Key of the deleted universe
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/universes/{slug}/manifest:
    get:
      tags: [Universes]
      summary: Get universe manifest
      operationId: getUniverseManifest
      description: |
        Returns the universe's `_universe.yaml` manifest as JSON.
        The manifest defines content types, their fields, and validation rules.
        Returns null/empty if no manifest exists.
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Universe manifest (content-type schema definitions)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================
  # Entries
  # ============================================================

  /api/v1/universes/{slug}/entries:
    get:
      tags: [Entries]
      summary: List entries
      operationId: listEntries
      description: |
        Returns all entries in the universe matching the given filters.
        Public universes return entries to anonymous callers.
        Private universes require authentication.
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: type
          in: query
          schema:
            type: string
          description: Filter by entry type (e.g. `task`, `note`, `post`)
          example: task
        - name: limit
          in: query
          schema:
            type: integer
            default: 5000
            maximum: 50000
          description: Maximum entries to return
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search query
        - name: filter
          in: query
          schema:
            type: string
          description: |
            JSON-encoded frontmatter filter (e.g. `{"status":"done","project":"CO"}`).
            Only entries whose frontmatter contains all specified key-values are returned.
        - name: path_prefix
          in: query
          schema:
            type: string
          description: |
            Filter entries whose path starts with this prefix
            (e.g. `public/` returns all `public/*` entries).
        - name: semantic
          in: query
          schema:
            type: string
          description: Semantic similarity query text. Returns results ordered by cosine similarity.
        - name: k
          in: query
          schema:
            type: integer
            default: 10
          description: Number of results to return for semantic queries.
      responses:
        "200":
          description: Paginated list of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Entries]
      summary: Create an entry
      operationId: createEntry
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/universes/{slug}/entries/tags:
    get:
      tags: [Entries]
      summary: List all tags across entries
      operationId: listEntryTags
      description: |
        Returns every tag found in entry frontmatter across the universe,
        with occurrence counts, sorted by count descending.
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
