  # ============================================================
  # Auth
  # ============================================================

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Request a magic-code login email
      operationId: requestLoginCode
      description: |
        Sends a 6-digit verification code to the given email address.
        If the email is not registered, a new account is created on
        successful verification.

        Rate limited to prevent abuse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Code sent (or silently suppressed for unregistered addresses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/verify:
    post:
      tags: [Auth]
      summary: Verify magic code and open a session
      operationId: verifyLoginCode
      description: |
        Exchanges a valid magic code for a JWT session. The JWT is returned
        in the response body AND set as an HttpOnly `session` cookie.

        Use the cookie for browser-based clients; use the JWT body value for
        API clients that prefer the `Authorization: Bearer` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: JWT issued; session cookie set
          headers:
            Set-Cookie:
              description: "session=<jwt>; HttpOnly; SameSite=Strict; Path=/"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Code expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getMe
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        "200":
          description: Current user's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (clear session cookie)
      operationId: logout
      description: |
        Clears the `session` cookie. Works for both browser and API clients.
        No body required; no auth required (safe to call unauthenticated).
      responses:
        "200":
          description: Session cleared
          headers:
            Set-Cookie:
              description: "session=; expires=Thu, 01 Jan 1970 00:00:00 GMT"
              schema:
                type: string

  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Generate a long-lived API token
      operationId: createApiToken
      description: |
        Creates a long-lived API token for use in scripts, agents, and
        integrations (e.g. Obsidian plugin, co-sync).

        The `token` value is shown **only once** in the response and is not
        stored in plaintext. Store it securely immediately.
      security:
        - BearerAuth: []
        - SessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: API token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/events:
    get:
      tags: [Events]
      summary: Real-time EDA event stream (WebSocket)
      operationId: eventsWebSocket
      description: |
        Opens a WebSocket connection that streams JSON-serialized `Event`
        objects in real time as state-changing routes publish to the EDA bus.

        **Upgrade:** `GET /api/v1/events` with `Connection: Upgrade, Upgrade: websocket` headers.

        **Scope parameter:** `?scope=<universe_key>` limits the stream to a
        single universe. Use `scope=global` (default) for platform-wide public events.

        **Visibility federation (server-enforced):**
        | Client type | Receives |
        |---|---|
        | Anonymous (no token) | `Public` events only |
        | Authenticated member | `Public` + `UniverseMembers` for their universe |
        | Universe owner | All of the above + `UniverseOwner` |
        | System admin | All including `System` |

        `UserOnly` events are never forwarded to the WebSocket stream.

        **Authentication:** optional JWT via `?token=<jwt>` query param or
        session cookie. Without a valid token the connection is anonymous.

        **Frame format:** each frame is a JSON text message with the shape of
        the `Event` schema below. Binary frames are not used.

        **Latency:** < 50ms p99 (in-process tokio broadcast; CO-380 guarantee).

        **SPA consumer:** `/agora` (pt-BR) and `/live` (en) connect to this
        endpoint and render a live scrolling timeline (CO-381).

        **Sub-protocol:** `co.events.v1` (Sec-WebSocket-Protocol header).
      parameters:
        - name: scope
          in: query
          description: >
            Universe key to scope the stream, or `"global"` (default) for
            platform-wide public events.
          schema:
            type: string
            default: global
        - name: token
          in: query
          description: >
            Optional JWT token (alternative to `session` cookie). Omit to
            connect anonymously (Public events only).
          schema:
            type: string
      responses:
        "101":
          description: WebSocket connection established (Sec-WebSocket-Protocol co.events.v1)
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/events/bridge:
    get:
      tags: [Events]
      summary: Federated EDA bridge (deployment-to-deployment WebSocket)
      operationId: bridgeWebSocket
      description: |
        Persistent bidirectional WebSocket connection between CO deployments.
        Used to federate the local EDA bus across deployments (CO ↔ Yggdrasil,
        CO ↔ devices). Only trusted sources (listed in `CO_BRIDGE_TRUSTED_SOURCES`)
        are accepted; all others receive HTTP 403.

        **Sub-protocol:** `co.eda.bridge.v1` (Sec-WebSocket-Protocol header).

        **Protocol flow:**
        1. Remote connects with `?source=<host>&token=<jwt>`.
        2. Server validates trust list — 403 if unknown source.
        3. Remote sends `ReplayRequest{last_received_id}` to request missed events.
        4. Server replays events from `event_log` since that ULID.
        5. Bidirectional `Event` messages flow continuously.

        **Privacy rules (server-enforced):**
        | Visibility | Federated? |
        |---|---|
        | `Public` | Yes |
        | `UniverseMembers` | Yes |
        | `UniverseOwner` | No |
        | `UserOnly` | No |
        | `System` | No |

        **Loop guard:** events with `hop_count > 3` are silently dropped.

        **Heartbeat:** server sends a WebSocket Ping frame every 30 seconds
        (configurable via `CO_BRIDGE_HEARTBEAT_S`). Client should respond with Pong.

        **Reconnect:** connecting side uses exponential backoff
        (1 s → 2 s → 4 s → 8 s → 16 s → max 30 s).

        **Telemetry:** `bridge.connected`, `bridge.disconnected`, `bridge.event_received`,
        `bridge.event_sent`, and `bridge.replay_completed` events are published to
        the local bus with `Public` visibility (visible in `/agora`).

        **Configuration:**
        ```bash
        # Accept inbound connections from Yggdrasil
        flyctl secrets set CO_BRIDGE_TRUSTED_SOURCES="yggdrasil.artelonga.com.br" -a co-artelonga

        # Initiate outbound connection to Yggdrasil
        flyctl secrets set CO_BRIDGE_OUTBOUND_TOKENS_JSON='{"yggdrasil.artelonga.com.br":"<jwt>"}' -a co-artelonga
        ```
      parameters:
        - name: source
          in: query
          required: true
          description: >
            Identifier of the connecting deployment (e.g. "yggdrasil.artelonga.com.br").
            Must be listed in `CO_BRIDGE_TRUSTED_SOURCES`.
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: >
            JWT token issued by the connecting deployment. Used for authentication.
          schema:
            type: string
      responses:
        "101":
          description: WebSocket bridge established (Sec-WebSocket-Protocol co.eda.bridge.v1)
        "401":
          description: Missing or empty token
        "403":
          description: Source deployment not in trust list (CO_BRIDGE_TRUSTED_SOURCES)

  /api/v1/me/sync/conflicts:
    get:
      summary: List unresolved sync conflicts
      description: |
        CO-385: Lists all unresolved cross-device sync conflicts for the
        authenticated user. Conflicts arise when the same entry is modified on
        multiple devices while offline; the bridge layer (CO-384) detects them
        via body_hash comparison.

        The response includes a `suggested_action` per conflict: for `yggdrasil`
        universes the suggestion is `replace` (remote wins); for all other
        universes the suggestion is `update` (3-way merge).

        Each conflict row contains the `local_body_hash` and `remote_body_hash`
        so the UI can display a diff before the user chooses an action.
      operationId: listSyncConflicts
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: universe
          in: query
          required: false
          description: Narrow results to a specific universe key.
          schema:
            type: string
      responses:
        "200":
          description: List of unresolved conflicts
          content:
            application/json:
              schema:
                type: object
                required: [conflicts, total]
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncConflict'
                  total:
                    type: integer
        "401":
          description: Not authenticated

  /api/v1/sync/conflicts/{id}/resolve:
    post:
      summary: Resolve a sync conflict
      description: |
        CO-385: Applies one of the seven CRUD action-tree operations to the
        conflict identified by `{id}`. The action is applied atomically:
        the entry is written, the conflict is marked resolved, and a
        `sync.conflict_resolved` event is published to the CO-380 bus.

        When `apply_to_all_matching` is `true`, the same action is propagated
        to all remaining unresolved conflicts of the same `kind` in the same
        universe (bulk-apply). A `sync.conflict_resolved_bulk` event is
        published with the count.

        **Action semantics**:
        | action | CRUD | Effect |
        |--------|------|--------|
        | `keep_both` | C | Local renamed with `_1` suffix; remote written at original path |
        | `ignore` | — | No-op; marks conflict resolved without modifying entries |
        | `replace` | U | Overwrites local with remote (remote wins) |
        | `update` | U | 3-way merge; adds conflict markers if non-resolvable |
        | `upsert` | C+U | Merge existing diffs + insert new remote items |
        | `accept_delete` | D | Mirrors remote delete; hard-deletes local entry |
        | `keep_local` | — | Keeps local entry as-is; discards remote change |

        **CO-383 integration**: for the `yggdrasil` universe, the suggested
        default is `replace` (Yggdrasil is the authoritative source).
      operationId: resolveSyncConflict
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Conflict ULID from the `sync_conflicts` table.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    - keep_both
                    - ignore
                    - replace
                    - update
                    - upsert
                    - accept_delete
                    - keep_local
                apply_to_all_matching:
                  type: boolean
                  default: false
                  description: >
                    When true, apply this action to all remaining unresolved
                    conflicts of the same `kind` in the same universe.
      responses:
        "200":
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflict_id:
                    type: string
                  action:
                    type: string
                  path:
                    type: string
                    description: Final path of the entry after resolution.
                  event_type:
                    type: string
                    description: EDA event type published (sync.conflict_resolved).
                  bulk_resolved:
                    type: integer
                    description: >
                      Number of additional conflicts resolved (0 when
                      apply_to_all_matching is false).
        "400":
          description: Unknown action value
        "401":
          description: Not authenticated
        "404":
          description: Conflict not found

  # ---------------------------------------------------------------------------
  # CO-367: Universal KB sync
  # ---------------------------------------------------------------------------

  /api/v1/kb/ingest:
    post:
      summary: Ingest an entry into the KB warehouse
      description: >
        Idempotent upsert keyed by (universe_key, entry_path, body_hash).
        Same payload sent twice produces exactly one row.
        Auth: `Authorization: Bearer <CO_KB_TOKEN>` (env var).
        Returns 503 when CO_KB_TOKEN is not set (ingest disabled).
      tags: [kb]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbIngestBody'
      responses:
        "202":
          description: Entry accepted and indexed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbIngestResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          description: KB ingest disabled — CO_KB_TOKEN not set

  /api/v1/kb/search:
    get:
      summary: Full-text search over the KB warehouse
      description: >
        FTS5 search over `body_preview`. Optionally filtered to a single universe.
        Returns up to 100 results (default 20).
      tags: [kb]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: FTS5 query string
        - name: universe_key
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to a specific universe
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbSearchResponse'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/v1/kb/recent:
    get:
      summary: Recently-indexed KB entries
      description: >
        Returns the most recently-indexed entries (one per entry_path, latest version).
        Optionally filtered to a single universe. Limit clamped to [1, 100].
      tags: [kb]
      parameters:
        - name: universe_key
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recently-indexed entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbRecentResponse'
