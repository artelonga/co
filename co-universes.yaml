# CO Universe Registry
# Declares all content universes and their local sources.
# Server-generated universes (user boards, anon clones) are NOT listed here.
#
# Run:  co-sync <token>
# Token: co.artelonga.com.br/co/settings/sync  (one time)

server: https://co.artelonga.com.br

universes:

  # --- CO Platform ---
  - slug: co
    name: CO Platform
    local: work/co          # relative to this file
    visibility: public-subscribable
    description: CO open-source platform — board, tasks, docs

  # --- Comunicação (i18n + chat + chamadas) ---
  # Replaces the separate `language` / `mbya` / `topologia` entries (1.69.0).
  # Local dir is the unified merge of ~/projects/topologia + ~/projects/mbya.
  - slug: comunicacao
    name: Comunicação
    local: ~/projects/comunicacao
    visibility: public-subscribable
    description: i18n + chat + chamadas — espaço comunitário com tradução de conteúdo, mensagens e calls. Absorbs former mbya, topologia, and language universes.

  # --- Content universes ---
  - slug: artelonga
    name: ArteLonga
    local: ~/projects/artelonga
    visibility: public-subscribable
    description: Arte Longa — agência de gestão de carreira e comunicação

  - slug: quilomboaraucaria
    name: Quilombo Araucária
    local: ~/projects/quilomboaraucaria
    visibility: public-subscribable
    description: Plataforma comunitária do Quilombo Araucária
    rust_module: universes/quilombo   # co-web/src/universes/quilombo/ — processos, permissoes, storage

  - slug: rfq
    name: RFQ Gateway
    local: ~/projects/rfq-gateway
    visibility: private
    description: RFQ Gateway — trading API documentation

  - slug: time
    name: Time — earth, sky, and system events
    local: ~/projects/time
    visibility: public-subscribable
    description: Single universe for every time-stamped event — moon phases, eclipses, equinoxes, plus internal CRUD/telemetry. Absorbs the topologia fragments.

# ---------------------------------------------------------------------------
# CO-267: cross-repo push configuration
#
# Sister repos declare a similar `syncs:` block in *their own*
# co-universes.yaml and run `co-sync push` in CI on every merge to main.
# The entries below are *examples* — add to the sister repos, not here.
#
# Token: one CO Vault API token per repo, stored as the GH secret CO_VAULT_TOKEN.
# Generate: POST /api/v1/auth/token (or co-web admin UI → Settings → API tokens).
# ---------------------------------------------------------------------------
#
# Example for ~/projects/yggdrasil/co-universes.yaml:
#
# server: https://co.artelonga.com.br
# syncs:
#   - source: work/yggdrasil/
#     target: yggdrasil
#     include: ["*.md"]
#     exclude: ["CLAUDE.md", ".gitkeep"]
#   - source: CHANGELOG.md
#     target: yggdrasil
#   - source: README.md
#     target: yggdrasil
#
# Example for ~/projects/rfq-gateway/co-universes.yaml:
#
# server: https://co.artelonga.com.br
# syncs:
#   - source: work/rfq/
#     target: rfq
#     include: ["*.md"]
#     exclude: ["CLAUDE.md", ".gitkeep"]
#   - source: CHANGELOG.md
#     target: rfq
