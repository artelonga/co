name: Contract Probe

on:
  # Run automatically after every successful staging deploy
  workflow_run:
    workflows: ["Deploy to Staging"]
    types: [completed]

  # Allow manual trigger (e.g. to validate before tagging a release)
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Staging URL to probe"
        required: false
        default: "https://co-artelonga-staging.fly.dev"

  # Run on PRs that touch the API surface so drift is caught before merge
  pull_request:
    branches: [main]
    paths:
      - 'co-web/src/**/*_routes.rs'
      - 'co-web/openapi.yaml'
      - 'docs/architecture/api-catalog.md'

permissions:
  contents: read
  pull-requests: write  # for posting drift comments on PRs

jobs:
  probe:
    runs-on: ubuntu-latest
    # For workflow_run: only run when staging deploy succeeded.
    # For pull_request / workflow_dispatch: always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Advisory on PRs: staging is hand-deployed and auto-stops between
    # deploys, so a PR probe can fail purely from staleness or a sleeping
    # machine. The strict gate is release.yml's contract-check, which runs
    # when staging is freshly deployed per the release cadence.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    env:
      STAGING_URL: ${{ github.event.inputs.staging_url || 'https://co-artelonga-staging.fly.dev' }}
      CO_STAGING_ADMIN_TOKEN: ${{ secrets.CO_STAGING_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: co-web/package-lock.json

      - name: Install dependencies
        working-directory: co-web
        run: npm ci --no-audit --no-fund

      - name: Run contract probe
        id: probe
        working-directory: co-web
        run: |
          set +e
          npm run contract:probe
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-probe-report
          path: contract-probe-report.json
          retention-days: 30

      # Post a PR comment with the drift diff when triggered by a pull_request event
      - name: Post drift comment on PR
        if: >-
          always() &&
          steps.probe.outputs.exit_code != '0' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('contract-probe-report.json', 'utf8'));
            } catch {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## ⚠ Contract Probe Failed\n\nCould not read probe report. Check the [workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.',
              });
              return;
            }

            const drift = report.drift ?? [];
            if (drift.length === 0) return;

            const rows = drift.map(d =>
              `| \`${d.endpoint}\` | ${d.drift_type ?? '-'} | ${d.drift_detail ?? '-'} |`
            ).join('\n');

            const summary = report.summary ?? {};
            const body = [
              '## ⚠ Contract Probe — Drift Detected',
              '',
              `**Staging:** ${report.staging_url}`,
              `**Probed:** ${summary.probed}  |  **Passed:** ${summary.passed}  |  **Failed:** ${summary.failed}`,
              '',
              '| Endpoint | Drift type | Detail |',
              '|----------|------------|--------|',
              rows,
              '',
              `> Run [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · [Full report artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
