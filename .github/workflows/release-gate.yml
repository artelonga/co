name: Release Gate — Thursday DoD Check

# CO-382: Thursday release gate.
#
# Runs at 14:00 BRT (17:00 UTC) every Thursday.
# At 14:30 BRT the sprint-review.ts commits the sprint review doc.
# At 15:00 BRT the operator runs scripts/release-commit.sh for the v-tag.
#
# This workflow:
#   1. Checks all PRs merged since the last git tag have DoD JSON artifacts
#   2. Verifies DoD % >= 100% for every PR in the wave
#   3. Generates the sprint review (step in release-gate)
#   4. Fails if any PR is below 100% DoD — operator must use --ignore-dod to override
#
# On success: posts a "Release gate PASSED" summary.
# On failure: posts a "Release gate BLOCKED" summary listing failing PRs.

on:
  schedule:
    # 14:00 BRT = 17:00 UTC, every Thursday
    - cron: "0 17 * * 4"
  workflow_dispatch:
    inputs:
      ignore_dod:
        description: "Ignore DoD failures (emergency override — logged)"
        required: false
        default: "false"
        type: boolean

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: co-web/package-lock.json

      - name: Install dependencies
        working-directory: co-web
        run: npm ci

      - name: Find PRs merged since last tag
        id: wave-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            SINCE=$(git log -1 --format="%aI" "$LAST_TAG")
            echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
            echo "since=${SINCE}" >> "$GITHUB_OUTPUT"
            echo "Checking PRs merged since ${LAST_TAG} (${SINCE})"
          else
            echo "last_tag=" >> "$GITHUB_OUTPUT"
            echo "since=2000-01-01T00:00:00Z" >> "$GITHUB_OUTPUT"
            echo "No previous tag found — checking all merged PRs"
          fi

      - name: Verify DoD for wave PRs
        id: dod-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_DOD: ${{ github.event.inputs.ignore_dod || 'false' }}
        run: |
          SINCE="${{ steps.wave-prs.outputs.since }}"
          REPO="${{ github.repository }}"

          # Collect CO-IDs from merge commits since last tag
          CO_IDS=$(git log --format="%s" "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~100)"..HEAD \
            | grep -oP 'CO-\d+' | sort -u || true)

          if [ -z "$CO_IDS" ]; then
            echo "::notice::No CO-N tasks found in wave — gate passes trivially"
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
            echo "summary=No CO-N tasks in wave" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FAILED_IDS=""
          SUMMARY_LINES=""

          for CO_ID in $CO_IDS; do
            DOD_FILE="docs/scrum/dod/${CO_ID}.json"
            if [ -f "$DOD_FILE" ]; then
              PCT=$(python3 -c "import json,sys; d=json.load(open('$DOD_FILE')); print(d.get('dod_pct',0))")
              if [ "$PCT" = "100" ]; then
                SUMMARY_LINES="${SUMMARY_LINES}✅ ${CO_ID} — ${PCT}% DoD\n"
              else
                SUMMARY_LINES="${SUMMARY_LINES}❌ ${CO_ID} — ${PCT}% DoD\n"
                FAILED_IDS="${FAILED_IDS} ${CO_ID}"
              fi
            else
              SUMMARY_LINES="${SUMMARY_LINES}⚠️ ${CO_ID} — no DoD report found\n"
              FAILED_IDS="${FAILED_IDS} ${CO_ID}"
            fi
          done

          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          printf "$SUMMARY_LINES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED_IDS" ]; then
            if [ "$IGNORE_DOD" = "true" ]; then
              echo "::warning::--ignore-dod override active. Failing tasks:${FAILED_IDS}"
              echo "gate_passed=true" >> "$GITHUB_OUTPUT"
            else
              echo "gate_passed=false" >> "$GITHUB_OUTPUT"
              echo "failed_ids=${FAILED_IDS}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate sprint review (14:30 BRT)
        if: steps.dod-gate.outputs.gate_passed == 'true'
        working-directory: co-web
        run: node --import tsx scripts/scrum/sprint-review.ts
        env:
          GIT_AUTHOR_NAME: "CO Release Gate"
          GIT_AUTHOR_EMAIL: "ci@artelonga.com.br"
          GIT_COMMITTER_NAME: "CO Release Gate"
          GIT_COMMITTER_EMAIL: "ci@artelonga.com.br"

      - name: Push sprint review commit
        if: steps.dod-gate.outputs.gate_passed == 'true'
        run: |
          git push origin HEAD:main || echo "Nothing to push"

      - name: Post gate result summary
        run: |
          PASSED="${{ steps.dod-gate.outputs.gate_passed }}"
          SUMMARY="${{ steps.dod-gate.outputs.summary }}"
          if [ "$PASSED" = "true" ]; then
            echo "## ✅ Release Gate PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Release Gate BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failing tasks: ${{ steps.dod-gate.outputs.failed_ids }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### DoD Status" >> "$GITHUB_STEP_SUMMARY"
          printf "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if gate blocked
        if: steps.dod-gate.outputs.gate_passed == 'false'
        run: |
          echo "::error::Release gate blocked — DoD verification failed for:${{ steps.dod-gate.outputs.failed_ids }}"
          echo "Use workflow_dispatch with ignore_dod=true for emergency hotfix."
          exit 1
