name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CO-N: Cargo deps (prost-build / tonic-build, transitively pulled by
      # game-core and other workspace members) require `protoc` at build
      # time. The Dockerfile installs protobuf-compiler in the builder
      # stage, but CI's plain ubuntu-latest runner doesn't have it — every
      # workspace build since the proto-using deps landed (2026-04-30) has
      # failed here with "Could not find `protoc` installation". Install
      # it explicitly. Fix surfaced 2026-05-12 after CI was 100/100 red.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build co-web
        run: cargo build -p co-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: co-web/package-lock.json

      - name: Install Playwright dependencies
        working-directory: co-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: co-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: co-web
        env:
          CI: "true"
          RUST_LOG: "co_web=warn"
          JWT_SECRET: "ci-test-secret-do-not-use-in-production"
        run: npx playwright test --project=chromium-desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: co-web/playwright-report/
          retention-days: 14
