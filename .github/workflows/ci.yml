name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # nightly at 02:00 UTC — runs the full 4-project matrix

env:
  CARGO_TERM_COLOR: always
  # CI builds are one-shot — incremental compilation only bloats target/ and
  # has caused repeated runner disk-full failures on cold builds.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CO-N: Cargo deps (prost-build / tonic-build, transitively pulled by
      # game-core and other workspace members) require `protoc` at build
      # time. The Dockerfile installs protobuf-compiler in the builder
      # stage, but CI's plain ubuntu-latest runner doesn't have it — every
      # workspace build since the proto-using deps landed (2026-04-30) has
      # failed here with "Could not find `protoc` installation". Install
      # it explicitly. Fix surfaced 2026-05-12 after CI was 100/100 red.
      # System deps for cargo build --workspace. Mirrors the Dockerfile
      # builder stage + libdbus-1-dev for keyring/dbus-secret-service
      # which are pulled by co-cli / dev tools (not co-web itself, hence
      # the Dockerfile didn't need it).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler pkg-config libssl-dev g++ libdbus-1-dev

      - name: Setup Rust
        # rust-toolchain.toml at repo root pins the channel + components,
        # so any cargo invocation auto-installs the pinned version.
        # No `rustup update stable` here — that would race with the
        # toolchain file and risk pulling lints we haven't tested.
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  e2e:
    runs-on: ubuntu-latest
    needs: test
    # CO-359: PR/push → fast 2-project path (desktop-chromium + pixel-7, ≤15 min).
    # Nightly schedule → full 4-project matrix (adds iphone-14 + ipad-pro).
    strategy:
      fail-fast: false
      matrix:
        project: ${{ github.event_name == 'schedule' && fromJSON('["desktop-chromium","pixel-7","iphone-14","ipad-pro"]') || fromJSON('["desktop-chromium","pixel-7"]') }}
    steps:
      - uses: actions/checkout@v4

      # System deps for cargo build --workspace. Mirrors the Dockerfile
      # builder stage + libdbus-1-dev for keyring/dbus-secret-service
      # which are pulled by co-cli / dev tools (not co-web itself, hence
      # the Dockerfile didn't need it).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler pkg-config libssl-dev g++ libdbus-1-dev

      - name: Setup Rust
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build co-web
        run: cargo build -p co-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: co-web/package-lock.json

      - name: Install Playwright dependencies
        working-directory: co-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: co-web
        # iphone-14 and ipad-pro use WebKit; desktop-chromium and pixel-7 use Chromium.
        run: |
          case "${{ matrix.project }}" in
            iphone-14|ipad-pro) npx playwright install --with-deps webkit ;;
            *) npx playwright install --with-deps chromium ;;
          esac

      - name: Run Playwright E2E tests
        working-directory: co-web
        env:
          CI: "true"
          RUST_LOG: "co_web=warn"
          JWT_SECRET: "ci-test-secret-do-not-use-in-production"
          # CO-208: bypass token-bucket rate limiting so fixtures don't exhaust
          # the anonymous 5-writes/min cap. Global-setup.ts forwards these to
          # the spawned co-web process. No effect outside CO_ENV=test.
          CO_ENV: "test"
          CO_BYPASS_RATE_LIMIT: "1"
        run: npx playwright test --project=${{ matrix.project }}

      - name: E2E test-count summary
        if: always()
        working-directory: co-web
        run: |
          echo "=== E2E tests per file ==="
          total=0
          bloat=0
          for f in e2e/*.spec.ts; do
            count=$(grep -c '^\s*test(' "$f" 2>/dev/null || echo 0)
            total=$((total + count))
            if [ "$count" -gt 30 ]; then
              echo "⚠ $count  $f  (>30)"
              bloat=$((bloat + 1))
            else
              echo "  $count  $f"
            fi
          done
          echo "--- total: $total e2e tests ---"
          if [ "$bloat" -gt 0 ]; then
            echo "::warning::$bloat spec file(s) exceed 30-test limit — run scripts/co-test review --fail-on-bloat locally"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: co-web/playwright-report/
          retention-days: 14
