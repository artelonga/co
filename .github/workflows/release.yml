name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CO-316: x86_64-apple-darwin and aarch64-unknown-linux-gnu dropped.
          # Both failed in v2.32.0 release because fastembed → ort → ort-sys:
          # ort doesn't publish prebuilt binaries for Intel Mac, and the cross
          # container for aarch64-linux lacks openssl-dev. Both platforms have
          # near-zero self-hosting demand right now; re-add (with feature-gated
          # fastembed or a Cross.toml) when a user actually asks.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler pkg-config libssl-dev g++ libdbus-1-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Setup Rust
        run: rustc --version && cargo --version

      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (aarch64-linux)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build -p co-cli --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.use_cross != true
        run: cargo build -p co-cli --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN="target/${{ matrix.target }}/release/co"
          ARCHIVE="co-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN = "target\${{ matrix.target }}\release\co.exe"
          $ARCHIVE = "co-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BIN -DestinationPath $ARCHIVE
          "ASSET=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
