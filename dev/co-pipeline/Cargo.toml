[package]
name = "co-pipeline"
version = "0.1.0"
edition = "2024"
description = "co-pipeline — end-to-end content pipeline UAT runner (CO-88, developer tooling, NOT part of the CO scaffold)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/artelonga/co"
publish = false

[[bin]]
name = "co-pipeline"
path = "src/main.rs"

[lib]
name = "co_pipeline"
path = "src/lib.rs"

[dependencies]
co = { path = "../../core" }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
walkdir = { workspace = true }
zstd = { workspace = true }
sha2 = "0.10"
blake3 = { workspace = true }
prost = "0.13"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
ureq = "3"

[dev-dependencies]
tempfile = { workspace = true }
