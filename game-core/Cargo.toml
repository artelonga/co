[package]
name = "game-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "game_core"
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/bin/6ca5cab7/main.rs"

[features]
default = []
multiplayer = ["redis", "tokio", "futures"]

[dependencies]
clap = { version = "4", features = ["env", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
colored = "2"
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
nanoid = "0.4"
rand = "0.8"
redis = { version = "0.25", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
obfstr = "0.4.4"
prost = "0.13"
redb = "2.4"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hostname = "0.4"
toml = "0.8"
axum = "0.8"

[build-dependencies]
prost-build = "0.13"
chacha20poly1305 = "0.10"
rand = "0.8"
