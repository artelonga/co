# co-lsp — Language Server Protocol server for CO universes.
# Standalone workspace so it can be built/distributed independently.
# Add to root Cargo.toml members in the release commit.

[workspace]
resolver = "2"

[package]
name = "co-lsp"
version = "0.1.0"
edition = "2024"
description = "LSP server for CO universe content — wikilink completion, hover, diagnostics"
license = "AGPL-3.0-or-later"
repository = "https://github.com/artelonga/co"

[[bin]]
name = "co-lsp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
toml = "0.8"
dirs = "5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
