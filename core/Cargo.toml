[package]
name = "co"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for CO - graph-based content management"
repository.workspace = true
publish.workspace = true

# This crate can be used as a dependency in other projects
# See README.md for usage instructions

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
bincode = { workspace = true }

# Files
memmap2 = { workspace = true }
walkdir = { workspace = true }

# Compression
zstd = { workspace = true }
brotli = "8"

# CO-87 protocol-stack layers: cache + sqlite backend.
# (crypto deps chacha20poly1305 / ed25519-dalek / rand are shared with the
#  CO-86 `.co` format block below — declared once there with rand_core feature.)
lru = { workspace = true }
rusqlite = { workspace = true }

# Time
chrono = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
dirs = "5"

# JSON Schema generation
schemars = "0.8"

# Hashing (for body_hash in Entry)
sha2 = "0.10"

# Protobuf (wire format for Entry)
prost = "0.13"
# CO-86 — well-known types (google.protobuf.Struct) for the `.co` envelope's
# typed-frontmatter `extra` field.
prost-types = "0.13"

# CO-86 — `.co` format crypto layers (composed around the protobuf envelope).
chacha20poly1305 = "0.10"                                   # body encryption (AEAD)
ed25519-dalek = { version = "2", features = ["rand_core"] } # detached signatures
rand = { workspace = true }                                 # key generation

# Graph
petgraph = { workspace = true }

# Async (for deployer adapter trait)
async-trait = { workspace = true }

# Tarball support (for BuildArtifact extraction and creation)
flate2 = "1"
tar = "0.4"

# Temp directories (used at runtime by deployer adapters)
tempfile = { workspace = true }

# AWS SDK — R2 static-on-r2 adapter (optional; enable via `deploy-r2` feature)
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = { workspace = true }
mockall = "0.13"
tokio = { workspace = true }
# CO-86 — encode/decode throughput + compression-ratio benchmark
criterion = "0.5"

[[bench]]
name = "co_format_bench"
harness = false

[features]
default = []
# Gate the AWS SDK — compile with --features deploy-r2 to enable R2 deploys
deploy-r2 = ["dep:aws-sdk-s3", "dep:aws-config"]
# Enable full graph traversal capabilities
full-graph = []
# Enable translation support
translations = []
# Enable all features (deploy-r2 intentionally excluded — add explicitly when needed)
all = ["full-graph", "translations"]
