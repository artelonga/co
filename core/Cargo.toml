[package]
name = "co"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for CO - graph-based content management"
repository.workspace = true
publish.workspace = true

# This crate can be used as a dependency in other projects
# See README.md for usage instructions

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
bincode = { workspace = true }

# Files
memmap2 = { workspace = true }
walkdir = { workspace = true }

# Compression
zstd = { workspace = true }

# Time
chrono = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
dirs = "5"

# JSON Schema generation
schemars = "0.8"

# Hashing (for body_hash in Entry)
sha2 = "0.10"

# Protobuf (wire format for Entry)
prost = "0.13"

# Graph
petgraph = { workspace = true }

# Async (for deployer adapter trait)
async-trait = { workspace = true }

# Tarball support (for BuildArtifact extraction and creation)
flate2 = "1"
tar = "0.4"

# Temp directories (used at runtime by deployer adapters)
tempfile = { workspace = true }

# AWS SDK — R2 static-on-r2 adapter
aws-sdk-s3 = "1"
aws-config = "1"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = { workspace = true }
mockall = "0.13"
tokio = { workspace = true }

[features]
default = []
# Enable full graph traversal capabilities
full-graph = []
# Enable translation support
translations = []
# Enable all features
all = ["full-graph", "translations"]
