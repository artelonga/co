# Tool Schema
# Defines property types for tool definitions
name: tools
version: 1
properties:
  category:
    kind: text
    required: true
  tool_type:
    kind: text
    values: [deterministic, predictive]
    default: deterministic
  command:
    kind: text
  status:
    kind: text
  dependencies:
    kind: list
  url:
    kind: link
