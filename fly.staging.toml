# Staging environment — automated test gate for Wave 4 (CO-379)
# Deploy: flyctl deploy --config fly.staging.toml --remote-only
# Secrets: JWT_SECRET, CO_SEED_ADMIN_EMAIL, CO_SEED_ADMIN_PASSWORD_HASH
app = "co-artelonga-staging"
primary_region = "gru"

[build]
  dockerfile = "co-web/Dockerfile"

[mounts]
  source = "co_staging_data"
  destination = "/data"

[env]
  CO_WEB_DATA = "/data"
  CO_WEB_PORT = "3000"
  RUST_LOG = "co_web=info,tower_http=warn"
  CO_ENV = "staging"
  CO_BACKUP_BACKEND = "disabled"
  CO_BILLING_PROVIDER = "manual"
  CO_EMAIL_PROVIDER = "null"
  CO_TEST_NAMESPACE_SWEEP_DOW = "sun"
  CO_TEST_NAMESPACE_SWEEP_BRT = "03:00"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
