[package]
name = "co-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CO telemetry sidecar — batch-ships events to the CO ingest endpoint"
repository.workspace = true
publish.workspace = true

[dependencies]
co = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
zstd = { workspace = true }
rand = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
prost = "0.13"
# CO-151: filesystem watcher (FSEvents on macOS, inotify on Linux)
notify = "6"
notify-debouncer-mini = "0.4"
# CO-151: WebSocket client for sync channel
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
toml = "0.8"
rpassword = "7"
dirs-next = "2"
serde_yaml = "0.9"

[[bin]]
name = "co-agent"
path = "src/main.rs"

[[bin]]
name = "co-agent-watch"
path = "src/bin/watch.rs"

[[bin]]
name = "co-sync"
path = "src/bin/co-sync.rs"

[dev-dependencies]
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
tempfile = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
