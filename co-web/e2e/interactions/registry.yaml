# CO Interactions Registry — single source of truth
#
# Atomic platform primitives for content (entries). Each interaction
# documents one CRUD operation that's already exposed by the CO API.
# Content — the actual markdown, frontmatter, paths — is RUNTIME DATA
# passed in by the caller. The contract is the primitive, not any
# specific application use-case.
#
# Derivations from this file:
#   - OpenAPI 3.1 JSON at  GET /api/v1/interactions/openapi.json
#   - Interaction list at  GET /api/v1/interactions
#   - Single spec at       GET /api/v1/interactions/{operationId}
#   - (Future) executable  POST /api/v1/interactions/{operationId}
#
# Schema (per interaction):
#
#   id           Stable two-digit id
#   operationId  camelCase RPC name (URL slug)
#   title        One-line human label
#   method       HTTP verb the primitive maps to
#   path         URL template on the actual entries API
#   spec         Test file that exercises the primitive
#   parameters   JSON-Schema for typed inputs
#   preconditions  Rules that must hold before the call
#   postconditions Rules that must hold after the call
#   auth         { required: bool, scope: string }
#   safety       snapshot-restore | dry-run | destructive
#   tags         free-form labels

openapi: "3.1.0"
info:
  title: "CO Content Interactions"
  version: "1.0"
  description: |
    Atomic CRUD primitives on universe content entries.
    Content is runtime data — the primitives are the contract.

interactions:
  # ---------------------------------------------------------------
  # WRITE  (PUT — upserts; create or update is one operation in REST)
  # ---------------------------------------------------------------
  - id: "01"
    operationId: entryWrite
    title: "Create or update a content entry (upsert)"
    method: PUT
    path: "/api/v1/universes/{universe}/entries/{path}"
    spec: 01-content-crud.spec.ts

    parameters:
      type: object
      properties:
        universe:
          type: string
          description: "Universe key (e.g. 'artelonga', 'template')."
        path:
          type: string
          description: "Entry path within the universe (e.g. 'sobre.md', 'comunidades/falcao.md')."
        body:
          type: string
          description: "Markdown body. Content is opaque to the primitive."
        frontmatter:
          type: object
          description: "YAML frontmatter as a JSON object. Optional."
      required: [universe, path, body]

    preconditions:
      - id: "pre.auth"
        rule: "Caller is authenticated and has write scope on {universe}."

    postconditions:
      - id: "post.entry_readable"
        rule: "entryRead on the same {universe}::{path} returns 200 with the supplied body."
      - id: "post.frontmatter_preserved"
        rule: "If frontmatter was supplied, entryRead returns the same keys."

    auth: { required: true, scope: "write:universe" }
    safety: snapshot-restore
    tags: [content, crud, write]

  # ---------------------------------------------------------------
  # READ
  # ---------------------------------------------------------------
  - id: "02"
    operationId: entryRead
    title: "Read a content entry"
    method: GET
    path: "/api/v1/universes/{universe}/entries/{path}"
    spec: 01-content-crud.spec.ts

    parameters:
      type: object
      properties:
        universe: { type: string }
        path:     { type: string }
      required: [universe, path]

    preconditions:
      - id: "pre.universe_readable"
        rule: "{universe} is public OR caller has read scope on it."

    postconditions:
      - id: "post.body_present"
        rule: "Response includes the entry's body (may be empty string but key exists)."
      - id: "post.path_matches"
        rule: "Response.path == request {path}."

    auth: { required: false, scope: "read:universe" }
    safety: dry-run
    tags: [content, crud, read]

  # ---------------------------------------------------------------
  # DELETE
  # ---------------------------------------------------------------
  - id: "03"
    operationId: entryDelete
    title: "Delete a content entry"
    method: DELETE
    path: "/api/v1/universes/{universe}/entries/{path}"
    spec: 01-content-crud.spec.ts

    parameters:
      type: object
      properties:
        universe: { type: string }
        path:     { type: string }
      required: [universe, path]

    preconditions:
      - id: "pre.auth"
        rule: "Caller has write scope on {universe}."
      - id: "pre.entry_exists"
        rule: "entryRead on the same {universe}::{path} returns 200."

    postconditions:
      - id: "post.entry_gone"
        rule: "entryRead on the same {universe}::{path} returns 404."

    auth: { required: true, scope: "write:universe" }
    safety: destructive
    tags: [content, crud, delete]

  # ---------------------------------------------------------------
  # LIST
  # ---------------------------------------------------------------
  - id: "04"
    operationId: entryList
    title: "List entries in a universe"
    method: GET
    path: "/api/v1/universes/{universe}/entries"
    spec: 01-content-crud.spec.ts

    parameters:
      type: object
      properties:
        universe: { type: string }
        type:
          type: string
          description: "Optional frontmatter.type filter (page, task, event, clip, ...)."
        limit:
          type: integer
          default: 100
        q:
          type: string
          description: "Optional substring search across title/body/path."
      required: [universe]

    preconditions:
      - id: "pre.universe_readable"
        rule: "{universe} is public OR caller has read scope on it."

    postconditions:
      - id: "post.listing_shape"
        rule: "Response.entries is an array; each item has at minimum {path, title}."
      - id: "post.respects_limit"
        rule: "len(response.entries) <= request.limit."

    auth: { required: false, scope: "read:universe" }
    safety: dry-run
    tags: [content, crud, list]
