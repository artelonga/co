# CO Platform Interactions — canonical OpenAPI 3.1 document.
#
# Resources: `entry` (content), `auth` (sessions/tokens),
#            `admin` (platform management), `chat` (room-scoped messaging).
#
# This file IS the OpenAPI doc. The server embeds it via
# include_str!, parses it once at startup, and serves it as-is at
# GET /api/v1/interactions/openapi.json. No transformation.
#
# Pre/postconditions live in OpenAPI vendor extensions:
#   x-preconditions  — rules that must hold before the call
#   x-postconditions — rules that must hold after the call
#
# `x-safety` (snapshot-restore | dry-run | destructive) tells test
# harnesses what cleanup discipline a primitive requires.

openapi: "3.1.0"
info:
  title: "CO Platform API"
  version: "1.1.0"
  description: |
    Typed contract for CO Platform HTTP endpoints: content entries,
    authentication flows, admin operations, and universe chat.

    Four interaction classes:
    - entry: CRUD on universe content (path-keyed markdown + frontmatter)
    - auth: session lifecycle, token management, OAuth/OIDC flows
    - admin: platform management, telemetry, A/B flags, webhooks
    - chat: room-scoped messages within a universe

servers:
  - url: "https://co.artelonga.com.br"
  - url: "https://co-artelonga.fly.dev"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- content ---
    Entry:
      type: object
      required: [path]
      properties:
        path: { type: string }
        title: { type: string, nullable: true }
        body: { type: string }
        frontmatter: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntryList:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        total: { type: integer }
    EntryWriteBody:
      type: object
      required: [body]
      properties:
        body: { type: string, description: "Markdown body. Opaque to the primitive." }
        frontmatter:
          type: object
          additionalProperties: true
          description: "YAML frontmatter as a JSON object."

    # --- auth ---
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        tier: { type: string, enum: [free, plus, admin] }
    Session:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        expires_at: { type: string, format: date-time }
    ApiToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    # --- chat ---
    ChatRoom:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        is_private: { type: boolean }
        created_at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, body]
      properties:
        id: { type: integer }
        body: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    ChatMessageList:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        total: { type: integer }

    # --- admin ---
    Lead:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        message: { type: string, nullable: true }
        status: { type: string, enum: [new, contacted, converted, closed] }
        created_at: { type: string, format: date-time }
    AbFlag:
      type: object
      properties:
        key: { type: string }
        enabled: { type: boolean }
        description: { type: string, nullable: true }
        rollout_pct: { type: integer, minimum: 0, maximum: 100 }
    Webhook:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

paths:
  # =============================================================
  # CONTENT — entry CRUD (universe-scoped)
  # =============================================================
  /api/v1/universes/{universe}/entries/{path}:
    parameters:
      - name: universe
        in: path
        required: true
        schema: { type: string }
        description: "Universe key. Works for all universes the caller can access."
      - name: path
        in: path
        required: true
        schema: { type: string }
        description: "Entry path within the universe (e.g. `sobre.md`, `comunidades/falcao.md`)."

    get:
      operationId: getEntry
      summary: "Read an entry"
      tags: [entry]
      responses:
        '200':
          description: "Entry found"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        '404': { description: "Entry not found" }
      x-preconditions:
        - id: pre.universe_readable
          rule: "{universe} is public OR caller has read scope on it."
      x-postconditions:
        - id: post.path_matches
          rule: "response.path == request {path}."
        - id: post.body_present
          rule: "response.body key exists (may be empty string)."
      x-safety: dry-run

    put:
      operationId: putEntry
      summary: "Create or update an entry (upsert)"
      tags: [entry]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryWriteBody" }
      responses:
        '200': { description: "Upserted" }
        '201': { description: "Created" }
        '401': { description: "Auth required" }
        '403': { description: "Insufficient scope" }
      x-preconditions:
        - id: pre.auth
          rule: "Caller authenticated with write scope on {universe}."
      x-postconditions:
        - id: post.readable
          rule: "Subsequent GET on the same {universe} + {path} returns 200."
        - id: post.body_persisted
          rule: "Subsequent GET returns response.body == request.body."
        - id: post.frontmatter_persisted
          rule: "If frontmatter was sent, subsequent GET returns the same keys."
      x-safety: snapshot-restore

    delete:
      operationId: deleteEntry
      summary: "Delete an entry"
      tags: [entry]
      responses:
        '200': { description: "Deleted (or already absent)" }
        '401': { description: "Auth required" }
        '403': { description: "Insufficient scope" }
      x-preconditions:
        - id: pre.auth
          rule: "Caller authenticated with write scope on {universe}."
      x-postconditions:
        - id: post.gone
          rule: "Subsequent GET on the same {universe} + {path} returns 404."
      x-safety: destructive

  /api/v1/universes/{universe}/entries:
    parameters:
      - name: universe
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: listEntries
      summary: "List entries in a universe"
      tags: [entry]
      parameters:
        - name: type
          in: query
          schema: { type: string }
          description: "Filter by frontmatter.type (page, task, event, clip…)."
        - name: q
          in: query
          schema: { type: string }
          description: "Substring search across title/body/path."
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: "Listing"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryList" }
      x-preconditions:
        - id: pre.universe_readable
          rule: "{universe} is public OR caller has read scope on it."
      x-postconditions:
        - id: post.shape
          rule: "response.entries is an array; each item has at minimum {path}."
        - id: post.respects_limit
          rule: "len(response.entries) <= request.limit."
      x-safety: dry-run

  # =============================================================
  # AUTH — session lifecycle, tokens, OAuth/OIDC
  # =============================================================
  /api/v1/auth/login:
    post:
      operationId: authRequestCode
      summary: "Request email magic-code"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: "Code queued for delivery" }
        '422': { description: "Invalid email" }
        '429': { description: "Rate limited" }
      x-preconditions:
        - id: pre.valid_email
          rule: "request.email is a syntactically valid email address."
      x-postconditions:
        - id: post.code_queued
          rule: "A 6-digit code is queued for the email channel."
      x-safety: snapshot-restore

  /api/v1/auth/verify:
    post:
      operationId: authVerifyCode
      summary: "Exchange magic-code for session cookie"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string }
      responses:
        '200':
          description: "Session created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        '401': { description: "Invalid or expired code" }
      x-preconditions:
        - id: pre.code_valid
          rule: "request.code was issued for request.email and has not expired."
      x-postconditions:
        - id: post.session_cookie
          rule: "Response sets an HttpOnly session cookie."
        - id: post.session_shape
          rule: "Body contains user_id, display_name, expires_at."
      x-safety: snapshot-restore

  /api/v1/auth/me:
    get:
      operationId: authGetMe
      summary: "Current authenticated user + tier"
      tags: [auth]
      responses:
        '200':
          description: "Current user"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        '401': { description: "Not authenticated" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session cookie or Bearer token."
      x-postconditions:
        - id: post.shape
          rule: "Response contains id, display_name, tier."
      x-safety: dry-run

  /api/v1/auth/stats:
    get:
      operationId: authGetStats
      summary: "Per-user storage and usage statistics"
      tags: [auth]
      responses:
        '200': { description: "Usage stats" }
        '401': { description: "Not authenticated" }
      x-preconditions: [{id: pre.authed, rule: "Caller has a valid session."}]
      x-postconditions: [{id: post.shape, rule: "Response contains universe_count and entry_count."}]
      x-safety: dry-run

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      summary: "Clear session cookie"
      tags: [auth]
      responses:
        '204': { description: "Session cleared" }
      x-preconditions: [{id: pre.any, rule: "No auth required; clears session cookie if present."}]
      x-postconditions: [{id: post.cookie_cleared, rule: "Response unsets the session cookie."}]
      x-safety: snapshot-restore

  /api/v1/auth/password-login:
    post:
      operationId: authPasswordLogin
      summary: "Login with username+password (any environment)"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: "Session created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        '401': { description: "Invalid credentials" }
      x-preconditions:
        - id: pre.password_set
          rule: "User account has a password_hash set."
      x-postconditions:
        - id: post.session_cookie
          rule: "Response sets an HttpOnly session cookie."
      x-safety: snapshot-restore

  /api/v1/auth/signup:
    post:
      operationId: authSignup
      summary: "Create account with username+password"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string, nullable: true }
      responses:
        '201':
          description: "Account created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        '409': { description: "Username already taken" }
        '429': { description: "Rate limit: 100 signups/day" }
      x-preconditions:
        - id: pre.unique_username
          rule: "request.username is not already registered."
      x-postconditions:
        - id: post.session
          rule: "Caller is immediately logged in. Response sets session cookie."
      x-safety: snapshot-restore

  /api/v1/auth/google/status:
    get:
      operationId: authGoogleStatus
      summary: "Whether Google OAuth is configured on this server"
      tags: [auth]
      responses:
        '200': { description: "OAuth status" }
      x-preconditions: [{id: pre.none, rule: "No auth required."}]
      x-postconditions: [{id: post.shape, rule: "Response contains enabled: bool."}]
      x-safety: dry-run

  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      summary: "Initiate password reset flow"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '204': { description: "Reset code queued (if email exists)" }
      x-preconditions:
        - id: pre.valid_email
          rule: "request.email is a valid email address."
      x-postconditions:
        - id: post.idempotent
          rule: "Always 204 regardless of whether the email is registered (prevents enumeration)."
      x-safety: snapshot-restore

  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      summary: "Complete password reset with recovery token"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string }
      responses:
        '204': { description: "Password updated" }
        '401': { description: "Invalid or expired token" }
      x-preconditions:
        - id: pre.token_valid
          rule: "request.token was issued by a forgot-password flow and has not expired."
      x-postconditions:
        - id: post.password_changed
          rule: "Subsequent password-login with the new password succeeds."
      x-safety: snapshot-restore

  /api/v1/auth/onboard-with-email:
    post:
      operationId: authOnboardWithEmail
      summary: "Passwordless onboarding — send magic code"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '204': { description: "Code sent" }
        '429': { description: "Rate limited" }
      x-preconditions:
        - id: pre.valid_email
          rule: "request.email is a valid email address."
      x-postconditions:
        - id: post.code_queued
          rule: "A verification code is queued for the provided email."
      x-safety: snapshot-restore

  /api/v1/auth/onboard-with-email/verify:
    post:
      operationId: authOnboardWithEmailVerify
      summary: "Passwordless onboarding — verify code and create session"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string }
      responses:
        '200':
          description: "Session created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        '401': { description: "Invalid or expired code" }
      x-preconditions:
        - id: pre.code_valid
          rule: "code was issued for email and has not expired."
      x-postconditions:
        - id: post.session_cookie
          rule: "Response sets an HttpOnly session cookie."
      x-safety: snapshot-restore

  /api/v1/auth/token:
    post:
      operationId: authCreateToken
      summary: "Create a long-lived API token"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: "Token created (raw secret shown once)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiToken" }
        '401': { description: "Not authenticated" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
      x-postconditions:
        - id: post.secret_once
          rule: "Response includes the raw token value; it will not be retrievable again."
      x-safety: snapshot-restore

  /api/v1/auth/tokens:
    get:
      operationId: authListTokens
      summary: "List long-lived API tokens (secrets redacted)"
      tags: [auth]
      responses:
        '200':
          description: "Token list"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        '401': { description: "Not authenticated" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
      x-postconditions:
        - id: post.no_secrets
          rule: "Token secrets are NOT included in the listing."
      x-safety: dry-run

  /api/v1/auth/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: authRevokeToken
      summary: "Revoke an API token"
      tags: [auth]
      responses:
        '204': { description: "Revoked" }
        '401': { description: "Not authenticated" }
        '404': { description: "Token not found" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller owns the token."
      x-postconditions:
        - id: post.token_invalid
          rule: "Subsequent requests using the token return 401."
      x-safety: destructive

  /api/v1/auth/exchange-session:
    post:
      operationId: authExchangeSession
      summary: "Exchange short-lived handover token for 7-day ES256 JWT"
      tags: [auth]
      responses:
        '200':
          description: "Long-lived token"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401': { description: "Invalid handover token" }
      x-preconditions:
        - id: pre.valid_handover
          rule: "Caller has a valid short-lived handover token in the request."
      x-postconditions:
        - id: post.jwt
          rule: "Response contains a 7-day ES256 JWT for co.artelonga.com.br."
      x-safety: snapshot-restore

  /api/v1/auth/uat-login:
    post:
      operationId: authUatLogin
      summary: "UAT login (yuri/uat — 404 in production)"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: "Session created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        '404': { description: "Endpoint not available in this environment" }
      x-preconditions:
        - id: pre.uat_env
          rule: "CO_ENV=uat is set on the server."
      x-postconditions:
        - id: post.session
          rule: "Response sets a session cookie for the yuri@uat.local account."
      x-safety: snapshot-restore

  /.well-known/openid-configuration:
    get:
      operationId: oidcDiscovery
      summary: "OIDC provider discovery document"
      tags: [auth, oidc]
      responses:
        '200': { description: "OIDC discovery JSON" }
      x-preconditions: [{id: pre.none, rule: "No auth required."}]
      x-postconditions: [{id: post.shape, rule: "Response contains issuer, authorization_endpoint, jwks_uri."}]
      x-safety: dry-run

  /.well-known/jwks.json:
    get:
      operationId: oidcJwks
      summary: "JWKS — ES256 public key set"
      tags: [auth, oidc]
      responses:
        '200': { description: "JSON Web Key Set" }
      x-preconditions: [{id: pre.none, rule: "No auth required."}]
      x-postconditions: [{id: post.shape, rule: "Response contains keys array with at least one ES256 key."}]
      x-safety: dry-run

  /oauth/token:
    post:
      operationId: oauthTokenExchange
      summary: "OAuth2 token exchange (authorization_code / refresh_token grant)"
      tags: [auth, oidc]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, redirect_uri, client_id]
              properties:
                grant_type: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200': { description: "Access token + id_token" }
        '400': { description: "Invalid grant" }
      x-preconditions:
        - id: pre.valid_code
          rule: "code was issued by GET /oauth/authorize for the same client_id."
      x-postconditions:
        - id: post.tokens
          rule: "Response contains access_token, token_type, and id_token."
      x-safety: snapshot-restore

  /oauth/userinfo:
    get:
      operationId: oauthUserinfo
      summary: "OIDC userinfo — claims for bearer token holder"
      tags: [auth, oidc]
      responses:
        '200': { description: "OIDC claims" }
        '401': { description: "Invalid token" }
      x-preconditions:
        - id: pre.bearer_token
          rule: "Request carries a valid Bearer access token."
      x-postconditions:
        - id: post.claims
          rule: "Response contains sub, name, email claims."
      x-safety: dry-run

  /api/v1/gestao/oauth/clients:
    get:
      operationId: gestaoListOauthClients
      summary: "List registered OAuth clients"
      tags: [admin, oidc]
      responses:
        '200': { description: "Client list" }
        '403': { description: "Gestao admin required" }
      x-preconditions: [{id: pre.gestao_admin, rule: "Caller is in GESTAO_GITHUB_ADMINS allow list."}]
      x-postconditions: [{id: post.shape, rule: "Response is an array of OAuth client records."}]
      x-safety: dry-run
    post:
      operationId: gestaoCreateOauthClient
      summary: "Register an OAuth client"
      tags: [admin, oidc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: { type: string }
                redirect_uris: { type: array, items: { type: string } }
      responses:
        '201': { description: "Client registered" }
        '403': { description: "Gestao admin required" }
      x-preconditions:
        - id: pre.gestao_admin
          rule: "Caller is in GESTAO_GITHUB_ADMINS allow list."
      x-postconditions:
        - id: post.shape
          rule: "Response contains client_id and client_secret."
      x-safety: snapshot-restore

  # =============================================================
  # ADMIN — platform management endpoints
  # =============================================================
  /api/v1/admin/dashboard:
    get:
      operationId: adminGetDashboard
      summary: "Cross-system admin dashboard"
      tags: [admin]
      responses:
        '200': { description: "Dashboard metrics" }
        '403': { description: "Admin required" }
      x-preconditions: [{id: pre.admin, rule: "Caller has admin tier."}]
      x-postconditions: [{id: post.shape, rule: "Response is a JSON object with system-wide metrics."}]
      x-safety: dry-run

  /api/v1/admin/users/origin-breakdown:
    get:
      operationId: adminUsersOriginBreakdown
      summary: "User signup origin breakdown"
      tags: [admin]
      responses:
        '200': { description: "Origin counts" }
        '403': { description: "Admin required" }
      x-preconditions: [{id: pre.admin, rule: "Caller has admin tier."}]
      x-postconditions: [{id: post.shape, rule: "Response is an array of {origin, count} objects."}]
      x-safety: dry-run

  /api/v1/admin/leads:
    get:
      operationId: adminListLeads
      summary: "List contact leads queue"
      tags: [admin]
