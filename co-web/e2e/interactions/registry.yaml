  # =============================================================
  # CHAT — room-scoped messaging within a universe
  # =============================================================
  /api/v1/universes/{universe}/chat/rooms:
    parameters:
      - name: universe
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: chatListRooms
      summary: "List chat rooms in a universe"
      tags: [chat]
      responses:
        '200':
          description: "Room list"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatRoom" }
        '401': { description: "Auth required" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.universe_accessible
          rule: "Caller is a member of {universe} or it is public."
      x-postconditions:
        - id: post.shape
          rule: "Response is an array of ChatRoom objects visible to the caller."
      x-safety: dry-run
    post:
      operationId: chatCreateRoom
      summary: "Create a chat room in a universe"
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                is_private: { type: boolean, default: false }
      responses:
        '201':
          description: "Room created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatRoom" }
        '401': { description: "Auth required" }
        '403': { description: "Universe members only" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.universe_member
          rule: "Caller is a member of {universe}."
      x-postconditions:
        - id: post.readable
          rule: "Subsequent GET /chat/rooms includes the new room."
      x-safety: snapshot-restore

  /api/v1/universes/{universe}/chat/rooms/{room_slug}/members:
    parameters:
      - name: universe
        in: path
        required: true
        schema: { type: string }
      - name: room_slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: chatListRoomMembers
      summary: "List members of a chat room"
      tags: [chat]
      responses:
        '200': { description: "Member list" }
        '401': { description: "Auth required" }
        '403': { description: "Not a room member" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.room_accessible
          rule: "Room is public or caller is a member."
      x-postconditions:
        - id: post.shape
          rule: "Response is an array of {user_id, display_name} objects."
      x-safety: dry-run

  /api/v1/universes/{universe}/chat/rooms/{room_slug}/messages:
    parameters:
      - name: universe
        in: path
        required: true
        schema: { type: string }
      - name: room_slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: chatListMessages
      summary: "Paginated message history"
      tags: [chat]
      parameters:
        - name: before
          in: query
          schema: { type: integer }
          description: "Cursor: return messages with id < before."
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: "Message page"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageList" }
        '401': { description: "Auth required" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.room_accessible
          rule: "Room is public or caller is a member."
      x-postconditions:
        - id: post.shape
          rule: "Response contains messages array and total count."
        - id: post.cursor
          rule: "If before is set, all returned messages have id < before."
      x-safety: dry-run
    post:
      operationId: chatPostMessage
      summary: "Post a message to a room"
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201':
          description: "Message created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        '401': { description: "Auth required" }
        '403': { description: "Not a room member" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.room_member
          rule: "Caller is a member of the room."
      x-postconditions:
        - id: post.readable
          rule: "Subsequent GET /messages includes the new message."
        - id: post.websocket_fan_out
          rule: "Message is broadcast to all connected WebSocket clients."
      x-safety: snapshot-restore

  /api/v1/universes/{universe}/chat/rooms/{room_slug}/messages/{msg_id}:
    parameters:
      - name: universe
        in: path
        required: true
        schema: { type: string }
      - name: room_slug
        in: path
        required: true
        schema: { type: string }
      - name: msg_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: chatEditMessage
      summary: "Edit own message body"
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '200':
          description: "Message updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        '401': { description: "Auth required" }
        '403': { description: "Only the message author may edit" }
        '404': { description: "Message not found" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.author
          rule: "Caller is the author of message {msg_id}."
      x-postconditions:
        - id: post.updated
          rule: "Message body reflects the new content; updated_at is set."
      x-safety: snapshot-restore
    delete:
      operationId: chatDeleteMessage
      summary: "Delete own message (admin may delete any)"
      tags: [chat]
      responses:
        '204': { description: "Deleted" }
        '401': { description: "Auth required" }
        '403': { description: "Only author or universe admin may delete" }
        '404': { description: "Message not found" }
      x-preconditions:
        - id: pre.authed
          rule: "Caller has a valid session."
        - id: pre.author_or_admin
          rule: "Caller is the message author OR has admin role in {universe}."
      x-postconditions:
        - id: post.gone
          rule: "Subsequent GET /messages does not include the deleted message."
      x-safety: destructive
