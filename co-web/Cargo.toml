[package]
name = "co-web"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
yrs = "0.22"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "trace", "set-header", "request-id"] }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rust-embed = "8"
jsonwebtoken = "9"
redb = "2"
co = { path = "../core" }
# CO-503: canonical tool contract + legacy Tool trait live in the co-engine crate.
co-engine = { path = "../co" }
game-core = { path = "../game-core" }
argon2 = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
nanoid = { workspace = true }
xxhash-rust = { workspace = true }
lru = { workspace = true }
toml = { workspace = true }
dirs = "5"
fastembed = "5"
prost = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
async-trait = { workspace = true }
percent-encoding = "2"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
# CO-449: telemetry cold-tier archival to Parquet (columnar + zstd, DuckDB-readable).
arrow = "58"
parquet = { version = "58", features = ["arrow", "zstd"] }
hmac = "0.12"
sha1 = "0.10"
chacha20poly1305 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
parking_lot = "0.12"
maxminddb = "0.24"
nix = { version = "0.28", features = ["fs", "resource"] }
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", features = ["tonic"] }
# CO-457: decode inbound OTLP metric exports (Claude Code native telemetry).
# Reuses the CO-291 OTLP stack — message structs only (no tonic client/server).
opentelemetry-proto = { version = "0.26", default-features = false, features = ["gen-tonic-messages", "metrics"] }
tracing-opentelemetry = "0.27"
# CO-384: outbound bridge WS client (connects CO to peer deployments).
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[[bin]]
name = "split_db"
path = "src/bin/split_db.rs"

[[bin]]
name = "migrate_check"
path = "src/bin/migrate_check.rs"

[features]
default = []
blob-r2 = ["co/deploy-r2"]
backup-s3 = []
backup-r2 = []
backup-fly = []
backup-gcs = []
# CO-380: EDA backend alternatives (stubs — fill when scale demands)
eda-redis = []
eda-nats = []
eda-persistence = []
# CO-388: Security audit backend alternatives
security-claude = []
security-semgrep = []
security-sonar = []
# CO-366: future billing providers (stubs — fill in v3.1)
billing-pix = []
billing-stripe = []

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
serde_urlencoded = "0.7"
tokio = { workspace = true, features = ["test-util"] }
