  # ========================================
  # JWT — Autenticação necessária
  # ========================================

  # --- Auth ---

  /api/v1/quilombo/auth/login:
    post:
      tags: ["Quilombo: Auth"]
      summary: Login com usuário e senha
      operationId: loginQuilombo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUsuario"
      responses:
        "200":
          description: JWT token + dados do usuário
          headers:
            Set-Cookie:
              description: "session={jwt}; HttpOnly; SameSite=Strict"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais inválidas
        "429":
          description: Muitas tentativas (rate limited)

  /api/v1/quilombo/auth/cadastro:
    post:
      tags: ["Quilombo: Auth"]
      summary: Registrar novo membro
      operationId: cadastroQuilombo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarUsuario"
      responses:
        "201":
          description: Conta criada + JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Dados inválidos
        "409":
          description: Usuário já existe

  /api/v1/auth/login:
    post:
      tags: ["CO: Auth Email"]
      summary: Solicitar código de verificação por email
      operationId: loginEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Código enviado (se email cadastrado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/auth/verify:
    post:
      tags: ["CO: Auth Email"]
      summary: Verificar código e obter JWT
      operationId: verificarCodigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: JWT emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  email:
                    type: string
                  display_name:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  # --- Perfil (JWT) ---

  /api/v1/quilombo/perfil:
    get:
      tags: ["Quilombo: Perfil"]
      summary: Obter meu perfil
      operationId: obterPerfil
      security:
        - bearerJWT: []
      responses:
        "200":
