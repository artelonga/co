<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CO — Histórico</title>
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<!-- CO-558: the changelog has a single home — the board's "Histórico" view-tab.
     This standalone /changelog route no longer renders a second changelog
     surface; it redirects to that one board tab (`?view=changelog`). -->
<meta http-equiv="refresh" content="0; url=/?view=changelog">
<script>window.location.replace('/?view=changelog');</script>
<style>
  body{background:#0f172a;color:#e2e8f0;font:14px/1.6 system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  a{color:#7c6fcd}
</style>
</head>
<body>
<p>Redirecionando para o <a href="/?view=changelog">Histórico</a>…</p>
</body>
