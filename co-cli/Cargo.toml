[package]
name = "co-cli"
version = "0.17.0"
edition = "2024"
description = "CLI for CO - graph-based content management"
license = "MIT"
repository = "https://github.com/institutional-pointset/co"
publish = false

[[bin]]
name = "co"
path = "src/main.rs"

[dependencies]
co = { path = "../core", features = ["all"] }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
colored = "2.0"
comfy-table = { workspace = true }
rustyline = "14"
dirs = "5"
atty = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
