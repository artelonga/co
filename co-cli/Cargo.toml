[package]
name = "co-cli"
version = "2.42.0"
edition = "2024"
description = "CLI for CO - graph-based content management"
license = "AGPL-3.0-or-later"
repository = "https://github.com/artelonga/co"
publish = false

[[bin]]
name = "co"
path = "src/main.rs"

[dependencies]
co = { path = "../core", features = ["all"] }
clap = { workspace = true }
clap_mangen = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
colored = "2.0"
comfy-table = { workspace = true }
rustyline = "14"
dirs = "5"
atty = "0.2"
co-engine = { path = "../co" }
co-web = { path = "../co-web" }
anyhow = { workspace = true }
whoami = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
rpassword = "7"
toml = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = { workspace = true }
