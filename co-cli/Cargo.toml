[package]
name = "co-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for CO - graph-based content management"
license = "MIT"
repository = "https://github.com/institutional-pointset/co"

[[bin]]
name = "co"
path = "src/main.rs"

[dependencies]
co = { path = "../core", features = ["all"] }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
colored = "2.0"
comfy-table = { workspace = true }
